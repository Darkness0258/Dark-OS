name: Build ISO

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    permissions:
      contents: write
    container:
      image: archlinux
      options: --privileged
    steps:
      - name: Ensure git is available for checkout
        run: pacman -Syu --needed --noconfirm git
      - name: Check out profile
        uses: actions/checkout@v4
      - name: Install ISO and AUR build dependencies
        run: >-
          pacman -Syu --needed --noconfirm archiso base-devel curl desktop-file-utils
          git mkinitcpio pacman-contrib python python-yaml clamav gtk3 gtk-layer-shell
          python-cairo python-gobject python-cryptography python-pillow vte3
          poppler-glib xorg-server-xvfb xorg-xauth
      - name: Validate profile sources
        run: |
          set -euo pipefail
          for script in build-iso.sh profiledef.sh ci/*.sh; do
            bash -n "$script"
          done
          bash ci/test-build-bootstrap.sh
          bash ci/test-docker-workspace.sh
          while IFS= read -r script; do
            bash -n "$script"
          done < <(find airootfs/usr/local/bin -maxdepth 1 -type f ! -name '*.py' -print)
          python - <<'PY'
          from pathlib import Path
          import yaml

          # Compile every shipped Python module without importing it.  This
          # catches syntax errors in standalone desktop applications too,
          # rather than discovering them only after the costly ISO build.
          for path in Path("airootfs/usr/local/bin").rglob("*.py"):
              compile(path.read_text(encoding="utf-8"), str(path), "exec")
          paths = list(Path("airootfs/etc/calamares").rglob("*.conf"))
          paths.append(Path("airootfs/usr/share/calamares/branding/darkos/branding.desc"))
          for path in paths:
              yaml.safe_load(path.read_text(encoding="utf-8"))
          PY
          for desktop in airootfs/usr/share/applications/*.desktop; do
            desktop-file-validate "$desktop"
          done
      - name: Run Linux backend and native app regressions
        run: |
          set -euo pipefail
          python ci/test-phase3-linux.py
          python ci/test-app-kit.py
          python ci/test-gaming.py
          python ci/test-network-connect.py
          python ci/test-store.py
          python ci/test-calculator-clock.py
          python ci/test-mail.py
          python ci/test-performance.py
          python ci/test-native-storage.py
          python ci/test-shield.py
          xvfb-run -a dbus-run-session -- python ci/test-native-apps-linux.py
      - name: Seed Chaotic-AUR and BlackArch mirrorlists and keyrings
        run: |
          set -euo pipefail
          source ci/blackarch-keyring.sh
          darkos_seed_build_repositories

      - name: Record tool versions (diagnose rolling-repo breaks)
        run: |
          pacman -Qi archiso | grep Version
          bash --version | head -n 1
      - name: Build DarkOS ISO
        run: bash build-iso.sh
      - name: Split ISO for release
        run: |
          cd out
          split -b 1900M darkos-*.iso darkos-iso-part-
      - name: Publish ISO Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "DarkOS Build #${{ github.run_number }}"
          files: out/darkos-iso-part-*
