name: Build ISO

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: archlinux
      options: --privileged
    steps:
      - name: Ensure git is available for checkout
        run: pacman -Sy --noconfirm git
      - name: Check out profile
        uses: actions/checkout@v4
      - name: Install archiso
        run: pacman -Syu --noconfirm archiso curl sudo
      - name: Seed Chaotic-AUR and BlackArch mirrorlists and keyrings
        run: |
          mkdir -p /etc/pacman.d
          pacman-key --init
          pacman-key --populate archlinux || true
          pacman-key --recv-key 3056513887B78AEB --keyserver keyserver.ubuntu.com || true
          pacman-key --lsign-key 3056513887B78AEB || true
          pacman -U --noconfirm 'https://cdn-mirror.chaotic.cx/chaotic-aur/chaotic-keyring.pkg.tar.zst' || true
          pacman -U --noconfirm 'https://cdn-mirror.chaotic.cx/chaotic-aur/chaotic-mirrorlist.pkg.tar.zst' || true
          printf '%s\n' 'Server = https://blackarch.org/blackarch/$repo/os/$arch' > /etc/pacman.d/blackarch-mirrorlist
          curl -fsSLO https://blackarch.org/strap.sh
          chmod +x strap.sh
          ./strap.sh || true
      - name: Seed Archiso releng boot profile
        run: |
          cp -rn /usr/share/archiso/configs/releng/airootfs/. airootfs/
          cp -r /usr/share/archiso/configs/releng/efiboot .
      - name: Re-assert exec bits (survive releng-airootfs merge)
        run: |
          chmod +x airootfs/usr/local/bin/darkos-grub-install.sh \
                   airootfs/usr/local/bin/darkos-tty1-login \
                   airootfs/usr/local/bin/darkos-tool-groups \
                   airootfs/usr/local/bin/darkos-diagnose.sh \
                   airootfs/usr/local/bin/darkos-shell.py \
                   airootfs/usr/local/bin/the-void.sh \
                   airootfs/usr/local/bin/start-hyprland \
                   airootfs/usr/local/bin/darkos-firstboot-tools

      - name: Record tool versions (diagnose rolling-repo breaks)
        run: |
          hyprland --version 2>/dev/null || pacman -Qi hyprland 2>/dev/null | grep Version || true
          pacman -Qi calamares 2>/dev/null | grep Version || true
          pacman -Qi archiso 2>/dev/null | grep Version || true
      - name: Build DarkOS ISO
        run: bash build-iso.sh
      - name: Split ISO for release
        run: |
          cd out
          split -b 1900M darkos-*.iso darkos-iso-part-
      - name: Publish ISO Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: DarkOS Build #${{ github.run_number }}
          files: out/darkos-iso-part-*
