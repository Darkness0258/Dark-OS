name: Build ISO

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: archlinux
      options: --privileged
    steps:
      - name: Ensure git is available for checkout
        run: pacman -Sy --noconfirm git
      - name: Check out profile
        uses: actions/checkout@v4
      - name: Install ISO and AUR build dependencies
        run: pacman -Syu --needed --noconfirm archiso base-devel curl desktop-file-utils git mkinitcpio pacman-contrib python python-yaml
      - name: Validate profile sources
        run: |
          set -euo pipefail
          bash -n build-iso.sh ci/build-calamares.sh ci/verify-iso.sh profiledef.sh
          while IFS= read -r script; do
            bash -n "$script"
          done < <(find airootfs/usr/local/bin -maxdepth 1 -type f ! -name '*.py' -print)
          python - <<'PY'
          from pathlib import Path
          import yaml

          shell = Path("airootfs/usr/local/bin/darkos-shell.py")
          compile(shell.read_text(encoding="utf-8"), str(shell), "exec")
          paths = list(Path("airootfs/etc/calamares").rglob("*.conf"))
          paths.append(Path("airootfs/usr/share/calamares/branding/darkos/branding.desc"))
          for path in paths:
              yaml.safe_load(path.read_text(encoding="utf-8"))
          PY
          for desktop in airootfs/usr/share/applications/*.desktop; do
            desktop-file-validate "$desktop"
          done
      - name: Seed Chaotic-AUR and BlackArch mirrorlists and keyrings
        run: |
          set -euo pipefail
          export TERM=xterm
          mkdir -p /etc/pacman.d
          pacman-key --init
          pacman-key --populate archlinux
          for attempt in 1 2 3; do
            pacman-key --recv-key 3056513887B78AEB --keyserver keyserver.ubuntu.com && break
            if [ "$attempt" -eq 3 ]; then exit 1; fi
          done
          pacman-key --lsign-key 3056513887B78AEB
          pacman -U --needed --noconfirm 'https://cdn-mirror.chaotic.cx/chaotic-aur/chaotic-keyring.pkg.tar.zst'
          pacman -U --needed --noconfirm 'https://cdn-mirror.chaotic.cx/chaotic-aur/chaotic-mirrorlist.pkg.tar.zst'
          printf '%s\n' 'Server = https://blackarch.org/blackarch/$repo/os/$arch' > /etc/pacman.d/blackarch-mirrorlist
          curl --fail --location --retry 3 --retry-all-errors --output strap.sh https://blackarch.org/strap.sh
          chmod +x strap.sh
          # strap.sh imports the BlackArch signing key via a keyserver, which
          # can return "No data" on transient network errors. Retry the key
          # import before falling back to a manual fetch.
          for attempt in 1 2 3 4 5; do
            ./strap.sh && break
            echo "strap.sh attempt $attempt failed; retrying in 10s..."
            sleep 10
          done
          # Even after a successful exit, strap.sh's selected mirror may have
          # timed out during the sync. Use the canonical HTTPS endpoint and
          # require a usable sync database before allowing any package
          # transaction to continue.
          printf '%s\n' 'Server = https://blackarch.org/blackarch/$repo/os/$arch' > /etc/pacman.d/blackarch-mirrorlist
          for attempt in 1 2 3; do
            pacman -Syy --noconfirm && test -s /var/lib/pacman/sync/blackarch.db && break
            if [ "$attempt" -eq 3 ]; then exit 1; fi
          done

      - name: Record tool versions (diagnose rolling-repo breaks)
        run: |
          pacman -Qi archiso | grep Version
          bash --version | head -n 1
      - name: Build DarkOS ISO
        run: bash build-iso.sh
      - name: Split ISO for release
        run: |
          cd out
          split -b 1900M darkos-*.iso darkos-iso-part-
      - name: Publish ISO Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "DarkOS Build #${{ github.run_number }}"
          files: out/darkos-iso-part-*
