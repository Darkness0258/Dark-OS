[options]
HoldPkg     = pacman glibc
Architecture = auto
Color
CheckSpace
VerbosePkgLists
ParallelDownloads = 5
# ISO construction may pull multi-hundred-megabyte packages through a slow
# mirror. Keep libalpm from discarding a complete batch because a detached
# signature briefly falls below its default low-speed threshold.
DisableDownloadTimeout
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist

[chaotic-aur]
SigLevel = Required DatabaseOptional
Include = /etc/pacman.d/chaotic-mirrorlist

[blackarch]
SigLevel = Required DatabaseOptional
# The packaged mirrorlist can select a slow or unreachable third-party mirror
# during a fresh ISO build. Keep the build deterministic by using BlackArch's
# canonical HTTPS endpoint.
Server = https://blackarch.org/blackarch/$repo/os/$arch
