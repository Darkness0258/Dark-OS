# Dark OS - Hyprland Configuration
#
# Target: Hyprland ≥ 0.43 (key-value format)
# NOTE: Hyprland 0.55+ added Lua-based hyprland.lua alongside this format.
#       The old key-value format loads for now but upstream has said it'll be
#       dropped "1-2 releases after 0.55" (i.e. roughly 0.57-0.58).
#       windowrulev2 is deprecated in favor of windowrule (a straight rename —
#       keep the class: field syntax, drop only the "v2" suffix).
#       When 0.57 ships, migrate both the format (to hyprland.lua) and
#       rules (to whatever API the Lua config provides).

monitor=,preferred,auto,1

exec-once = waybar
exec-once = /usr/lib/polkit-kde-authentication-agent-1
# PipeWire audio stack — started at session start because there's no
# display manager to do it. wireplumber is the session manager.
exec-once = wireplumber
exec-once = pipewire
exec-once = pipewire-pulse

env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORM,wayland
env = GDK_BACKEND,wayland
env = AQ_NO_HARDWARE_CURSORS,1

input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
    }
}

general {
    gaps_in = 8
    gaps_out = 16
    border_size = 2
    col.active_border = rgba(00e5ffee) rgba(2d7bffee) 45deg
    col.inactive_border = rgba(10142388)
    layout = dwindle
}

decoration {
    rounding = 16
    blur {
        enabled = true
        size = 8
        passes = 3
    }
    shadow {
        enabled = true
        range = 20
        render_power = 3
        color = rgba(00020a99)
    }
}

animations {
    enabled = true
    bezier = darkBezier, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 6, darkBezier
    animation = windowsOut, 1, 6, default, popin 80%
    animation = border, 1, 10, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

dwindle {
    preserve_split = true
}

misc {
    force_default_wallpaper = 0
}

windowrule = opacity 0.88 0.88, match:class ^(kitty)$
windowrule = opacity 0.92 0.92, match:class ^(wofi)$
windowrule = float on, match:class ^(wofi)$

$mainMod = SUPER

# "The Void" launcher — forces software rendering only inside a VM
# (kitty needs OpenGL 3.3+; VMware's virtual GPU often lacks it).
# Real hardware gets hardware rendering automatically.
# Invoked via `sh` so it works even if the exec bit is lost during
# the CI releng-airootfs merge (see CLAUDE.md line-endings caution).
bind = $mainMod, Q, exec, sh /usr/local/bin/the-void.sh
bind = $mainMod, C, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, E, exec, wofi --show drun
bind = $mainMod, V, togglefloating,
bind = $mainMod, P, pseudo,
bind = $mainMod, J, layoutmsg, togglesplit

bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
