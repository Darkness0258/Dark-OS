# Dark OS - Hyprland Configuration
#
# Target: Hyprland 0.53+ (windowrule syntax); legacy key-value format, see docs/MASTER-PLAN.md P2
# NOTE: Hyprland 0.55+ added Lua-based hyprland.lua alongside this format.
#       windowrulev2 is deprecated in favor of windowrule.

monitor=,preferred,auto,1

# Core autostart: wallpaper first, then bar, notifications and the shell.
# waybar, mako and the shell start first; everything else is staggered with a
# short sleep so ~10 processes do not fight over the CPU in the first seconds
# after login (that burst is what made the session feel frozen in a VM).
exec-once = python /usr/local/bin/darkos-window-fx.py --wallpaper-apply
exec-once = waybar
exec-once = mako
exec-once = python /usr/local/bin/darkos-shell.py
# Shield continuous protection: watches ~/Downloads and ~/Desktop, auto-
# quarantines anything ClamAV flags. Needs mako (already above) to alert
# on a detection -- see darkos-protect.py's module docstring for scope.
exec-once = sh -c 'sleep 8; exec python /usr/local/bin/darkos-protect.py'
exec-once = hypridle
exec-once = sh -c 'sleep 4; exec nm-applet --indicator'
exec-once = sh -c 'sleep 6; exec blueman-applet'
exec-once = sh -c 'sleep 3; exec /usr/lib/polkit-kde-authentication-agent-1'

# First-boot BlackArch tool-group picker (skips on live ISO and after first run)
exec-once = sh -c 'sleep 10; exec /usr/local/bin/darkos-firstboot-tools'
# Restore saved magnifier zoom after Hyprland is up.
exec-once = python /usr/local/bin/darkos-window-fx.py --a11y-apply

# PipeWire and WirePlumber are socket/service activated by systemd --user.

env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORM,wayland
env = GDK_BACKEND,wayland
env = AQ_NO_HARDWARE_CURSORS,1
# Suppress Python SyntaxWarnings from Calamares (invalid escape sequences
# in /usr/lib/calamares/modules/bootloader/main.py). These are cosmetic
# warnings in upstream Calamares that partially obscure the installer UI.
env = PYTHONWARNINGS,ignore::SyntaxWarning

input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
    }
}

general {
    gaps_in = 8
    gaps_out = 16
    border_size = 1
    # One accent (tokens.ACCENT) on the focused window only; the inactive
    # border is the text colour at 12%. ci/test-design-tokens.py checks these
    # two lines against the palette.
    col.active_border = rgba(00e5ffcc)
    col.inactive_border = rgba(eff2f61f)
    layout = dwindle
}

decoration {
    rounding = 16
    blur {
        enabled = true
        size = 8
        # Was 3. Each pass is a full-screen shader operation Hyprland runs
        # for every blurred surface -- on a 940MX (2GB, Maxwell-era, no
        # dedicated compositor headroom) that's a real, documented cost,
        # not a guess. 2 is the common middle ground for weaker GPUs in
        # Hyprland's own community configs. Matches ui-rules.md's own
        # stated policy: degrade blur/particles first, never frame pacing.
        passes = 2
    }
    shadow {
        enabled = true
        range = 20
        render_power = 3
        color = rgba(00020a99)
    }
}

animations {
    enabled = true
    bezier = darkBezier, 0.05, 0.9, 0.1, 1.05
    # Motion budget (docs/MASTER-PLAN.md section 5): compositor animations
    # only, ~200 ms for windows and panels, ~250 ms for workspaces, never
    # looping. Hyprland's speed unit is deciseconds, so 2 = 200 ms.
    animation = windows, 1, 2, darkBezier
    animation = windowsOut, 1, 2, default, popin 80%
    animation = border, 1, 2, default
    animation = fade, 1, 2, default
    animation = layers, 1, 2, default
    animation = workspaces, 1, 2.5, default
}

dwindle {
    preserve_split = true
}

misc {
    # The wallpaper is drawn by swaybg (darkos-window-fx.py --wallpaper-apply,
    # image from Settings > Wallpaper). This colour shows until it appears, and
    # if the image is ever missing. Keep it equal to wallpapers.FALLBACK_COLOR.
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    background_color = rgb(060a11)
}

# Window rules
windowrule = opacity 0.88 0.88, match:class ^(kitty)$
windowrule = float on, match:class ^(kitty)$
windowrule = opacity 0.92 0.92, match:class ^(wofi)$
windowrule = float on, match:class ^(wofi)$
windowrule = float on, match:class ^(darkos-switcher)$
windowrule = center on, match:class ^(darkos-switcher)$
windowrule = pin on, match:class ^(darkos-switcher)$
windowrule = float on, match:class ^(darkos-search)$
windowrule = center on, match:class ^(darkos-search)$
windowrule = pin on, match:class ^(darkos-search)$
windowrule = float on, match:class ^(darkos-overview)$
windowrule = center on, match:class ^(darkos-overview)$
windowrule = pin on, match:class ^(darkos-overview)$
windowrule = float on, match:class ^(darkos-snap-picker)$
windowrule = center on, match:class ^(darkos-snap-picker)$
windowrule = pin on, match:class ^(darkos-snap-picker)$

# darkos-terminal.py / darkos-files.py set their Wayland app_id via
# GLib.set_prgname() at startup. Verify the reported class with
# `hyprctl clients -j` on real hardware — if GDK reports something
# else, update the match string here to suit.
windowrule = float on, match:class ^(darkos-terminal)$
windowrule = float on, match:class ^(darkos-files)$
windowrule = float on, match:class ^(darkos-notes)$
windowrule = float on, match:class ^(darkos-calendar)$
windowrule = float on, match:class ^(darkos-clock)$
windowrule = float on, match:class ^(darkos-calculator)$
windowrule = float on, match:class ^(darkos-clipboard)$
windowrule = float on, match:class ^(darkos-emoji)$
windowrule = float on, match:class ^(darkos-gallery)$
windowrule = float on, match:class ^(darkos-reader)$
windowrule = float on, match:class ^(darkos-downloads)$
windowrule = float on, match:class ^(darkos-settings)$
windowrule = float on, match:class ^(darkos-network)$
windowrule = float on, match:class ^(darkos-security)$
windowrule = float on, match:class ^(darkos-backup)$
windowrule = float on, match:class ^(darkos-dashboard)$
windowrule = float on, match:class ^(darkos-mission)$
windowrule = float on, match:class ^(darkos-devhub)$
windowrule = float on, match:class ^(darkos-store)$
windowrule = float on, match:class ^(darkos-gaming)$
windowrule = float on, match:class ^(darkos-mail)$

# Frosted glass is for the dock only. The status bar and the Command Center
# are solid surfaces, so neither is blurred. Hyprland 0.55+ uses
# property-first layer rules with an explicit namespace matcher.
layerrule = match:namespace ^(darkos-dock)$, blur on, blur_popups on, ignore_alpha 0.08

$mainMod = SUPER

# "The Void" launcher & shell shortcuts
bind = $mainMod, Q, exec, sh /usr/local/bin/the-void.sh
bind = $mainMod, C, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, E, exec, python /usr/local/bin/darkos-window-fx.py --search
bind = $mainMod, S, exec, python /usr/local/bin/darkos-shell.py --toggle-side-panels
bind = $mainMod, H, exec, python /usr/local/bin/darkos-shell.py --toggle-command-center
bind = $mainMod, L, exec, loginctl lock-session
bind = $mainMod, V, togglefloating,
bind = $mainMod, P, pseudo,
bind = $mainMod, J, layoutmsg, togglesplit

bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5

# Launch / window basics
bind = $mainMod, Return, exec, sh /usr/local/bin/the-void.sh
bind = $mainMod, F, fullscreen,
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Media, volume and brightness keys (repeat while held / work when locked)
bindel = , XF86AudioRaiseVolume, exec, pamixer -i 5
bindel = , XF86AudioLowerVolume, exec, pamixer -d 5
bindl = , XF86AudioMute, exec, pamixer -t
bindl = , XF86AudioMicMute, exec, pamixer --default-source -t
bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous

# Alt+Tab window switcher, universal search, snap layouts, workspace
# overview, and accessibility zoom -- see darkos-window-fx.py.
bind = ALT, Tab, exec, python /usr/local/bin/darkos-window-fx.py --switcher
bind = $mainMod, Tab, exec, python /usr/local/bin/darkos-window-fx.py --overview
bind = $mainMod CTRL, left, exec, python /usr/local/bin/darkos-window-fx.py --snap left
bind = $mainMod CTRL, right, exec, python /usr/local/bin/darkos-window-fx.py --snap right
bind = $mainMod CTRL, up, exec, python /usr/local/bin/darkos-window-fx.py --snap maximize
bind = $mainMod CTRL, down, exec, python /usr/local/bin/darkos-window-fx.py --snap-picker
bind = $mainMod, equal, exec, python /usr/local/bin/darkos-window-fx.py --zoom in
bind = $mainMod SHIFT, equal, exec, python /usr/local/bin/darkos-window-fx.py --zoom in
bind = $mainMod, minus, exec, python /usr/local/bin/darkos-window-fx.py --zoom out
bind = $mainMod, 0, exec, python /usr/local/bin/darkos-window-fx.py --zoom reset
bind = $mainMod SHIFT, S, exec, python /usr/local/bin/darkos-window-fx.py --snip
bind = , Print, exec, python /usr/local/bin/darkos-window-fx.py --snip-screen
bind = $mainMod SHIFT, A, exec, python /usr/local/bin/darkos-window-fx.py --snip-annotate
bind = $mainMod SHIFT, P, exec, python /usr/local/bin/darkos-window-fx.py --pip

# Desktop-effects profile (Settings > Performance), written by
# darkos-perf-apply at every login and whenever the setting changes. Must be
# sourced LAST: "lite" overrides decoration/animation options and adds a
# final opacity-1 window rule, and later rules win. Empty file = "full".
source = ~/.config/hypr/conf.d/perf-auto.conf
