# Dark OS - Hyprland Configuration
#
# Target: Hyprland ≥ 0.43 (key-value format)
# NOTE: Hyprland 0.55+ added Lua-based hyprland.lua alongside this format.
#       The old key-value format loads for now but upstream has said it'll be
#       dropped "1-2 releases after 0.55" (i.e. roughly 0.57-0.58).
#       windowrulev2 syntax is also deprecated in favor of windowrule,
#       but windowrule parsing is not yet functional on this version.
#       When 0.57 ships, migrate both the format (to hyprland.lua) and
#       rules (to whatever API the Lua config provides).

monitor=,preferred,auto,1

exec-once = waybar
exec-once = /usr/lib/polkit-kde-authentication-agent-1

env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORM,wayland
env = GDK_BACKEND,wayland
env = AQ_NO_HARDWARE_CURSORS,1

input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
    }
}

general {
    gaps_in = 8
    gaps_out = 16
    border_size = 2
    col.active_border = rgba(00e5ffee) rgba(2d7bffee) 45deg
    col.inactive_border = rgba(10142388)
    layout = dwindle
}

decoration {
    rounding = 16
    blur {
        enabled = true
        size = 8
        passes = 3
    }
    shadow {
        enabled = true
        range = 20
        render_power = 3
        color = rgba(00020a99)
    }
}

animations {
    enabled = true
    bezier = darkBezier, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 6, darkBezier
    animation = windowsOut, 1, 6, default, popin 80%
    animation = border, 1, 10, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

dwindle {
    preserve_split = true
}

misc {
    force_default_wallpaper = 0
}

windowrulev2 = opacity 0.88 0.88,class:^(kitty)$
windowrulev2 = opacity 0.92 0.92,class:^(wofi)$
windowrulev2 = float,class:^(wofi)$

$mainMod = SUPER

bind = $mainMod, Q, exec, kitty
bind = $mainMod, C, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, E, exec, wofi --show drun
bind = $mainMod, V, togglefloating,
bind = $mainMod, P, pseudo,
bind = $mainMod, J, layoutmsg, togglesplit

bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
