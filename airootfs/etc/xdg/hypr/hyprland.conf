# Dark OS - Hyprland Configuration
#
# Target: Hyprland ≥ 0.43 (key-value format)
# NOTE: Hyprland 0.55+ added Lua-based hyprland.lua alongside this format.
#       windowrulev2 is deprecated in favor of windowrule.

monitor=,preferred,auto,1

# Core background and overlay autostart
exec-once = swaybg -i /usr/share/backgrounds/darkos/darkos-wallpaper.png -m fill
exec-once = waybar
exec-once = mako
exec-once = python /usr/local/bin/darkos-shell.py
exec-once = /usr/lib/polkit-kde-authentication-agent-1

# First-boot BlackArch tool-group picker (skips on live ISO and after first run)
exec-once = sh /usr/local/bin/darkos-firstboot-tools

# PipeWire audio stack — started at session start because there's no display manager
exec-once = wireplumber
exec-once = pipewire
exec-once = pipewire-pulse

env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORM,wayland
env = GDK_BACKEND,wayland
env = AQ_NO_HARDWARE_CURSORS,1
# Suppress Python SyntaxWarnings from Calamares (invalid escape sequences
# in /usr/lib/calamares/modules/bootloader/main.py). These are cosmetic
# warnings in upstream Calamares that partially obscure the installer UI.
env = PYTHONWARNINGS,ignore::SyntaxWarning

input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
    }
}

general {
    gaps_in = 8
    gaps_out = 16
    border_size = 2
    col.active_border = rgba(00e5ffee) rgba(2d7bffee) 45deg
    col.inactive_border = rgba(10142388)
    layout = dwindle
}

decoration {
    rounding = 16
    blur {
        enabled = true
        size = 8
        passes = 3
    }
    shadow {
        enabled = true
        range = 20
        render_power = 3
        color = rgba(00020a99)
    }
}

animations {
    enabled = true
    bezier = darkBezier, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 6, darkBezier
    animation = windowsOut, 1, 6, default, popin 80%
    animation = border, 1, 10, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

dwindle {
    preserve_split = true
}

misc {
    force_default_wallpaper = 0
}

# Window rules
windowrule = opacity 0.88 0.88, match:class ^(kitty)$
windowrule = opacity 0.92 0.92, match:class ^(wofi)$
windowrule = float on, match:class ^(wofi)$

# Layer blur/ignorezero rules removed: Hyprland is installed unpinned from
# the rolling repo and both syntax forms (bare "blur, ns" and
# "blur true, ns") produce "invalid field" errors on the shipped version.
# Re-add with correct syntax once Hyprland's version is pinned.

$mainMod = SUPER

# "The Void" launcher & shell shortcuts
bind = $mainMod, Q, exec, sh /usr/local/bin/the-void.sh
bind = $mainMod, C, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, E, exec, wofi --show drun
bind = $mainMod, SPACE, exec, python /usr/local/bin/darkos-shell.py --toggle-hud
bind = $mainMod, A, exec, python /usr/local/bin/darkos-shell.py --toggle-ai
bind = $mainMod, S, exec, python /usr/local/bin/darkos-shell.py --toggle-side-panels
bind = $mainMod, V, togglefloating,
bind = $mainMod, P, pseudo,
bind = $mainMod, J, layoutmsg, togglesplit

bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
