# DarkOS secure session lock. hyprlock owns authentication through PAM and
# ext-session-lock-v1; this file only defines presentation.

$font = Inter
$primary = rgba(00e5ffff)
$secondary = rgba(2d7bffff)
$text = rgba(f2f5f7ff)
$muted = rgba(9aa4adff)
$surface = rgba(16181cde)
$danger = rgba(ff3b3bff)
$success = rgba(22e07aff)

general {
    hide_cursor = false
    ignore_empty_input = true
    immediate_render = false
    screencopy_mode = 1
}

animations {
    enabled = true
    bezier = darkEase, 0.05, 0.9, 0.1, 1.05
    animation = fadeIn, 1, 6, darkEase
    animation = fadeOut, 1, 6, darkEase
    animation = inputFieldDots, 1, 4, darkEase
}

background {
    monitor =
    path = screenshot
    color = rgba(000000ff)
    blur_passes = 3
    blur_size = 8
    noise = 0.008
    contrast = 1.05
    brightness = 0.42
    vibrancy = 0.18
    vibrancy_darkness = 0.08
}

image {
    monitor =
    path = /usr/share/calamares/branding/darkos/icons/darkos.png
    size = 112
    rounding = 24
    border_size = 1
    border_color = rgba(00e5ff66)
    position = 0, 128
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = $text
    font_size = 32
    font_family = $font
    position = 0, -24
    halign = center
    valign = top
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %d"
    color = $muted
    font_size = 15
    font_family = $font
    position = 0, -72
    halign = center
    valign = top
}

label {
    monitor =
    text = CONTROL EVERYTHING
    color = $primary
    font_size = 15
    font_family = $font
    position = 0, 46
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 360, 56
    outline_thickness = 1
    inner_color = $surface
    outer_color = $primary $secondary 45deg
    check_color = $secondary $success 45deg
    fail_color = $danger
    font_color = $text
    font_family = $font
    fade_on_empty = false
    placeholder_text = <span foreground="#9aa4ad">Password</span>
    fail_text = <span foreground="#ff3b3b">Authentication failed ($ATTEMPTS)</span>
    rounding = 16
    dots_size = 0.24
    dots_spacing = 0.32
    position = 0, -76
    halign = center
    valign = center
}
