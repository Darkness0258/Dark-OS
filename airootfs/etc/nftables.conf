#!/usr/sbin/nft -f
# DarkOS firewall baseline.
#
# Posture: default-deny inbound, default-allow outbound. Outbound stays open
# here on purpose -- narrowing what individual apps can reach is the
# network broker's job (next layer), not this one's. This layer's job is
# just: nothing gets into this machine uninvited.
#
# Every inbound allow below exists because something already shipped in
# DarkOS depends on it. If you remove one, you're removing a feature.

flush ruleset

table inet filter {
    chain input {
        type filter hook input priority 0; policy drop;

        iif "lo" accept
        ct state established,related accept
        ct state invalid drop

        # Ping. Rate-limited so it's usable but not a flood vector.
        icmp type echo-request limit rate 10/second accept
        icmpv6 type { echo-request, nd-neighbor-solicit, nd-neighbor-advert, nd-router-advert } accept

        # DHCP lease renewal (dhcpcd).
        udp dport 68 accept

        # sshd.service is enabled by default in this repo (build-iso.sh's
        # runtime_symlinks) -- almost certainly a dev/VM-testing leftover,
        # not a real end-user default. Flagged separately; this rule just
        # matches what's actually enabled today so the firewall doesn't
        # silently break your own SSH-into-the-VM workflow.
        tcp dport 22 accept

        # KDE Connect (Network Center's pairing/discovery/transfer) --
        # upstream's own port assignment, not a DarkOS choice.
        udp dport 1716 accept
        tcp dport 1714-1764 accept
        udp dport 1714-1764 accept

        # Everything else inbound: logged, then dropped by the policy above.
        log prefix "darkos-fw-drop: " limit rate 5/minute
    }

    chain forward {
        type filter hook forward priority 0; policy drop;
    }

    chain output {
        type filter hook output priority 0; policy accept;
    }
}
