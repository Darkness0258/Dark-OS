# Calamares settings for DarkOS
# Minimal configuration -- expand as modules are built out
---
modules-search: [ /usr/lib/calamares/modules ]

instances:
  - id: live-cleanup
    module: shellprocess
    config: shellprocess@live-cleanup.conf
  - id: bootloader-install
    module: shellprocess
    config: shellprocess@bootloader-install.conf
  - id: pacman-keyring
    module: shellprocess
    config: shellprocess@pacman-keyring.conf
  - id: fix-greeter-groups
    module: shellprocess
    config: shellprocess@fix-greeter-groups.conf

sequence:
- show:
    - welcome
    - locale
    - keyboard
    - partition
    - users
    - darkosapikeys
    - summary
- exec:
    - partition
    - mount
    - unpackfs
    # unpackfs copies the live account and its privileged login settings.
    # Remove them before creating the real installed-system user.
    - removeuser
    - shellprocess@live-cleanup
    - machineid
    - fstab
    - locale
    - keyboard
    - luksbootkeyfile
    - luksopenswaphookcfg
    - grubcfg
    - shellprocess@bootloader-install
    - services-systemd
    - users
    - darkosapikeys
    - packages
    - shellprocess@fix-greeter-groups
    - shellprocess@pacman-keyring
    - networkcfg
    - hwclock
    - umount
- show:
    - finished

branding: darkos
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
