# SPDX-License-Identifier: GPL-3.0-or-later
#
# Archiso deliberately keeps the live key database on tmpfs and creates it at
# boot. The squashfs copied by Calamares therefore has no persistent GnuPG
# database. Replace those live-only units and initialize a durable keyring in
# the installed target after all keyring packages have been copied.
---
dontChroot: false
timeout: 300
verbose: true
script:
  - "/usr/bin/rm -f /etc/systemd/system/multi-user.target.wants/pacman-init.service"
  - "/usr/bin/rm -f /etc/systemd/system/pacman-init.service /etc/systemd/system/etc-pacman.d-gnupg.mount"
  - "/usr/bin/install -d -m 0755 /etc/pacman.d/gnupg"
  - "/usr/bin/pacman-key --init"
  - "/usr/bin/pacman-key --populate archlinux chaotic blackarch"
  - "/usr/bin/pacman-key --updatedb"
  - "/usr/bin/gpgconf --homedir /etc/pacman.d/gnupg --kill all"
  - "/usr/bin/test -s /etc/pacman.d/gnupg/pubring.gpg"
  - "/usr/bin/test -s /etc/pacman.d/gnupg/trustdb.gpg"
  - "/usr/bin/test ! -e /etc/systemd/system/multi-user.target.wants/pacman-init.service"
  - "/usr/bin/test ! -e /etc/systemd/system/etc-pacman.d-gnupg.mount"
i18n:
  name: "Initializing trusted package repositories"
