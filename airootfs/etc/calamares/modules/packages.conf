---
# Calamares is needed only in the live environment. Removing it from the
# copied target also removes dependencies used solely by the installer.
backend: pacman
skip_if_no_internet: false
update_db: false
update_system: false
pacman:
  num_retries: 0
  disable_download_timeout: false
  needed_only: true
operations:
  - remove:
      - calamares
