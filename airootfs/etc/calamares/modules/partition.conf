#
# Partitioning — guided layout for a clean DarkOS install.
# Schema-valid keys only — validated against partition.schema.yaml.
# The ESP mount point lives under efi.mountPoint (nested object),
# NOT a top-level efiMountPoint key. It is stored to global storage
# as efiSystemPartition, which the bootloader module reads.
#
---
defaultFileSystemType: ext4
drawNestedPartitions: false
alwaysShowPartitionLabels: true
efi:
    mountPoint: "/boot/efi"
    label: "DARKOS-ESP"
userSwapChoices: [ small ]
