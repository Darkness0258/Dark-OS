#
# GRUB config generation (writes /etc/default/grub)
# Schema-valid keys only — validated against grubcfg.schema.yaml
# (additionalProperties: false). Any unrecognized key rejects the
# whole config and the module silently does nothing, leaving
# /etc/default/grub with no boot entry → unbootable system.
#
---
overwrite: true
defaults:
    GRUB_TIMEOUT: 10
    GRUB_DEFAULT: 0
    GRUB_DISABLE_SUBMENU: true
    GRUB_TERMINAL_OUTPUT: "console"
    GRUB_DISABLE_RECOVERY: true
kernel_params:
    - "quiet"
