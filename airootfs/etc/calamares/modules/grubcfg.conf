---
# Calamares 3.4 schema keys. The bootloader wrapper validates and installs the
# generated configuration after this module prepares /etc/default/grub.
overwrite: false
prefer_grub_d: false
keep_distributor: false
kernel_params: []
defaults:
  GRUB_TIMEOUT: 10
  GRUB_DEFAULT: "0"
  GRUB_DISABLE_SUBMENU: true
  GRUB_TERMINAL_OUTPUT: "console"
  GRUB_DISABLE_RECOVERY: true
always_use_defaults: true
