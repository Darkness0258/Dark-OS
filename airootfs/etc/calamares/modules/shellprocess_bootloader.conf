#
# systemd-boot installation via shellprocess — Calamares' built-in
# bootloader modules (GRUB and systemd-boot) are unreliable in our
# chroot environment. This runs bootctl directly in the chroot after
# the ESP is mounted by the mount module.
#
---
script:
    - bootctl --esp-path=/boot/efi install
    - mkdir -p /boot/efi/loader
    - |
        cat > /boot/efi/loader/loader.conf << EOF
default darkos
timeout 10
console-mode max
editor no
EOF
    - mkdir -p /boot/efi/loader/entries
    - |
        ROOT_PARTUUID="$(blkid -s PARTUUID -o value "$(findmnt -nro SOURCE /)")"
        cat > /boot/efi/loader/entries/darkos.conf << EOF
title DarkOS
linux /vmlinuz-linux
initrd /initramfs-linux.img
options root=PARTUUID=${ROOT_PARTUUID} quiet splash
EOF
