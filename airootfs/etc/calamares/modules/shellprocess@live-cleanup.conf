#
# removeuser deliberately reports success even when userdel fails. Keep that
# supported module for account/home cleanup, then fail the install if the
# privileged live identity survived. Remove the remaining live-only files
# from the target while leaving the ISO's live session unchanged.
---
dontChroot: false
timeout: 30
verbose: true
script:
  # unpackfs can drop the exec bit from shipped scripts in the target
  # chroot; the bootloader step invokes darkos-grub-install.sh directly
  # (grubInstall), so re-assert +x here, before grubcfg/bootloader run.
  # Use bare "chmod" (resolved via PATH) instead of /bin/chmod in case
  # the /bin -> /usr/bin symlink is missing in the target chroot.
  - "chmod 0755 /usr/local/bin/darkos-grub-install.sh /usr/local/bin/darkos-tool-groups /usr/local/bin/darkos-diagnose.sh /usr/local/bin/the-void.sh"
  - "bash -n /usr/local/bin/darkos-grub-install.sh"
  - "test -x /usr/local/bin/darkos-grub-install.sh"
  - "/usr/bin/rm -f /etc/sudoers.d/darkos"
  - "/usr/bin/rm -f /etc/systemd/system/getty@tty1.service.d/autologin.conf"
  - "/usr/bin/rmdir --ignore-fail-on-non-empty /etc/systemd/system/getty@tty1.service.d"
  - "/usr/bin/rm -f /usr/local/bin/darkos-tty1-login"
  # NOT checking `getent passwd darkos`: a user may legitimately choose
  # "darkos" as their installed username after removeuser deleted the live
  # account. The file checks below are the real success criteria.
  - "/usr/bin/test ! -e /etc/sudoers.d/darkos"
  - "/usr/bin/test ! -e /etc/systemd/system/getty@tty1.service.d/autologin.conf"
  - "/usr/bin/test ! -e /usr/local/bin/darkos-tty1-login"
i18n:
  name: "Removing live-session privileges"
