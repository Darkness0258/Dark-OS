#
# removeuser deliberately reports success even when userdel fails. Keep that
# supported module for account/home cleanup, then fail the install if the
# privileged live identity survived. Remove the remaining live-only files
# from the target while leaving the ISO's live session unchanged.
---
dontChroot: false
timeout: 30
verbose: true
script:
  - "/usr/bin/rm -f /etc/sudoers.d/darkos"
  - "/usr/bin/rm -f /etc/systemd/system/getty@tty1.service.d/autologin.conf"
  - "/usr/bin/rmdir --ignore-fail-on-non-empty /etc/systemd/system/getty@tty1.service.d"
  - "/usr/bin/rm -f /usr/local/bin/darkos-tty1-login"
  - "! /usr/bin/getent passwd darkos >/dev/null 2>&1"
  - "/usr/bin/test ! -e /etc/sudoers.d/darkos"
  - "/usr/bin/test ! -e /etc/systemd/system/getty@tty1.service.d/autologin.conf"
i18n:
  name: "Removing live-session privileges"
