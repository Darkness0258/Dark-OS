# SPDX-License-Identifier: GPL-3.0-or-later
#
# removeuser deliberately reports success even when userdel fails. Keep that
# supported module for account/home cleanup, then fail the install if the
# privileged live identity survived. Remove the remaining live-only files
# from the target while leaving the ISO's live session unchanged.
---
dontChroot: false
timeout: 30
verbose: true
script:
  # unpackfs can drop the exec bit from shipped scripts in the target
  # chroot. Restore and validate every runtime entry point before later
  # installer jobs and the installed system can use them.
  # Use bare "chmod" (resolved via PATH) instead of /bin/chmod in case
  # the /bin -> /usr/bin symlink is missing in the target chroot.
  - "chmod 0755 /usr/local/bin/darkos-grub-install.sh /usr/local/bin/darkos-tool-groups /usr/local/bin/darkos-ai-snapshot /usr/local/bin/darkos-diagnose.sh /usr/local/bin/darkos-shell.py /usr/local/bin/darkos-installer /usr/local/bin/the-void.sh /usr/local/bin/start-hyprland /usr/local/bin/darkos-firstboot-tools"
  - "bash -n /usr/local/bin/darkos-grub-install.sh"
  - "bash -n /usr/local/bin/darkos-installer"
  - "bash -n /usr/local/bin/start-hyprland"
  - "bash -n /usr/local/bin/darkos-firstboot-tools"
  - "test -x /usr/local/bin/darkos-grub-install.sh"
  - "/usr/bin/rm -f /etc/sudoers.d/darkos"
  - "/usr/bin/rm -f /etc/systemd/system/getty@tty1.service.d/autologin.conf"
  - "/usr/bin/rmdir --ignore-fail-on-non-empty /etc/systemd/system/getty@tty1.service.d"
  - "/usr/bin/rm -f /usr/local/bin/darkos-tty1-login"
  - "/usr/bin/rm -f /usr/share/applications/darkos-installer.desktop"
  # The real users job runs later in the sequence, so `darkos` must be gone
  # at this point even when the buyer selected that same name. The users job
  # will then create a fresh, password-protected account.
  - "/usr/bin/bash -c '! /usr/bin/getent passwd darkos >/dev/null'"
  - "/usr/bin/test ! -e /home/darkos"
  - "/usr/bin/test ! -e /etc/sudoers.d/darkos"
  - "/usr/bin/test ! -e /etc/systemd/system/getty@tty1.service.d/autologin.conf"
  - "/usr/bin/test ! -e /usr/local/bin/darkos-tty1-login"
  - "/usr/bin/rm -f /etc/systemd/system/multi-user.target.wants/sshd.service"
  - "/usr/bin/test ! -e /etc/systemd/system/multi-user.target.wants/sshd.service"
i18n:
  name: "Removing live-session privileges"
