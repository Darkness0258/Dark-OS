#
# The greetd package creates the greeter user during the packages step,
# but it does not add greeter to the seat group. cage (the Wayland
# compositor wrapper used for ReGreet) needs seat group membership to
# open input devices through seatd. Without it, the login screen has
# no mouse or keyboard input.
---
dontChroot: false
timeout: 30
verbose: true
script:
  - "/usr/bin/usermod -aG seat greeter"
i18n:
  name: "Configuring login display"
