#
# Welcome screen — requirements that must be met before install proceeds.
# Schema-valid keys only. This Calamares build has its optional libparted
# welcome check disabled, so disk sizing is enforced by the partition module.
#
---
requirements:
  required:
    - ram
  requiredStorage: 8
  requiredRam: 2
  internetCheckUrl: https://ping.archlinux.org/nm-check.txt
  check:
    - ram
