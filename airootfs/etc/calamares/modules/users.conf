#
# User creation — creates a non-root daily user and sets root password.
# The live session's passwordless darkos user from the ISO is
# replaced by whatever the user sets here during install.

---
defaultGroups:
  - wheel
  - audio
  - video
  - storage
  - power
  - network
  - seat
# Calamares writes /etc/sudoers.d/10-installer with password-required
# wheel access. The live-only passwordless rule is removed separately.
sudoersGroup: wheel
sudoersConfigureWithGroup: true
# No autologin on the INSTALLED system — the user logs in normally.
# (The live ISO auto-logs-in via getty@tty1 autologin override, which
# is separate from this module and unaffected.) Re-enable here only
# if the product decides boot-to-desktop is wanted on real installs.
autologinGroup: ""
displayAutologin: false
doAutologin: false
setRootPassword: true
user:
  shell: /bin/bash
  home_permissions: "o700"
