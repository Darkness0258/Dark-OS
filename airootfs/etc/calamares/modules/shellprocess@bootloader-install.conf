#
# Run the DarkOS bootloader implementation through Bash instead of asking the
# Calamares bootloader module to execute the script directly. Some older ISO
# builds lost the script's executable bit while staging or extracting the
# squashfs, which made QProcess stop with exit code 126 before the script ran.
# Bash only needs the file to be readable, so the install remains reliable
# even if filesystem metadata is damaged. The cleanup job still restores and
# verifies mode 0755 for the installed system.
---
dontChroot: false
timeout: 1200
verbose: true
script:
  - "/usr/bin/bash /usr/local/bin/darkos-grub-install.sh"
i18n:
  name: "Installing and validating the bootloader"
