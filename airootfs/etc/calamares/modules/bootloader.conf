#
# GRUB EFI bootloader.
# Schema-valid keys only — this config is validated against
# bootloader.schema.yaml (additionalProperties: false), so any
# unrecognized key causes the ENTIRE config to be rejected and the
# bootloader module runs with no configuration (silently skipping
# installation). That was the root cause of "install completes but
# system won't boot".
#
# Arch kernels live flat in /boot (vmlinuz-linux), not under
# /usr/lib/modules/<version>/ like Fedora — so kernelSearchPath
# points at /boot.
#
---
efiBootLoader: "grub"
kernelSearchPath: "/boot"
kernelPattern: "^vmlinuz.*"

# GRUB 2 binary names.
# grubInstall points at darkos-grub-install.sh, a wrapper that adds
# --removable + --no-nvram (skips the NVRAM write that fails in
# VMs/chroots and causes exit code 1) and logs the real error to
# /boot/grub/install.log for diagnosis.
grubInstall: "/usr/local/bin/darkos-grub-install.sh"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"
efiBootMgr: "efibootmgr"

# Bootloader ID passed to grub-install --bootloader-id
efiBootloaderId: "DarkOS"

# Also write GRUB to the fallback EFI path (\EFI\BOOT\bootx64.efi)
# which VMware's firmware always checks even without an NVRAM entry
installEFIFallback: true
