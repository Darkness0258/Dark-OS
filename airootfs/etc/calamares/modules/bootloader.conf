#
# GRUB EFI bootloader. GRUB's grub-mkconfig scans /boot for kernels
# automatically (handles Arch's flat kernel layout at /boot/vmlinuz-linux).
# systemd-boot's module was incompatible — it searches for kernels under
# <kernelSearchPath>/<version>/<kernelName> which matches Fedora-style
# layouts but not Arch's.
#
---
efiBootLoader: "grub"
kernelSearchPath: "/usr/lib/modules"
kernelName: "vmlinuz-linux"
timeout: "10"
bootloaderEntryName: "DarkOS"
grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"
efiBootMgr: "efibootmgr"
efiMountDir: "/efi"
installEFIFallback: true
