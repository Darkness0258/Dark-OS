#
# GRUB EFI bootloader — installed by Calamares during the install.
#
# grubInstall points at darkos-grub-install.sh, the wrapper that passes
# --removable. This is REQUIRED in a VM: plain grub-install tries to
# write a firmware NVRAM boot entry, which has no EFI runtime in a
# VM/chroot, so it exits without writing the fallback path
# (\EFI\BOOT\BOOTX64.EFI) that VMware's firmware actually checks. The
# wrapper skips NVRAM entirely and writes the fallback, then generates
# grub.cfg if missing, logging to /boot/grub/install.log.
#
# Schema-valid keys only (bootloader.schema.yaml, additionalProperties:
# false). kernelSearchPath points at /boot because Arch kernels live
# flat there (vmlinuz-linux), not under /usr/lib/modules/<ver>/.
#
---
efiBootLoader: "grub"
kernelSearchPath: "/boot"
kernelPattern: "^vmlinuz.*"
grubInstall: "/usr/local/bin/darkos-grub-install.sh"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"
efiBootMgr: "efibootmgr"
efiBootloaderId: "DarkOS"
installEFIFallback: true
