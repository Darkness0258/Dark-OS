#
# Legacy Calamares bootloader-module configuration.
#
# DarkOS now runs the same implementation through
# shellprocess@bootloader-install so Bash opens the script directly. This
# avoids QProcess exit 126 if an old squashfs loses the executable bit. Keep
# this schema-valid file as a documented fallback, but it is not present in
# settings.conf's execution sequence.
#
# grubInstall points at darkos-grub-install.sh, the wrapper that passes
# --removable. This is REQUIRED in a VM: plain grub-install tries to
# write a firmware NVRAM boot entry, which has no EFI runtime in a
# VM/chroot, so it exits without writing the fallback path
# (\EFI\BOOT\BOOTX64.EFI) that VMware's firmware actually checks. The
# wrapper skips NVRAM entirely, writes the fallback loader, and atomically
# generates and validates grub.cfg. Calamares must not repeat its fallback
# copy or overwrite the validated configuration afterwards.
#
# Schema-valid keys only (bootloader.schema.yaml, additionalProperties:
# false). kernelSearchPath points at /boot because Arch kernels live
# flat there (vmlinuz-linux), not under /usr/lib/modules/<ver>/.
#
---
efiBootLoader: "grub"
kernelSearchPath: "/boot"
kernelPattern: "^vmlinuz.*"
grubInstall: "/usr/local/bin/darkos-grub-install.sh"
# Calamares unconditionally invokes this after grubInstall. The wrapper owns
# grub.cfg, so make the duplicate generator call a no-op.
grubMkconfig: "/usr/bin/true"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"
efiBootMgr: "efibootmgr"
efiBootloaderId: "DarkOS"
# The wrapper already creates EFI/BOOT/BOOTX64.EFI. Calamares' fallback copy
# expects EFI/DarkOS/grubx64.efi, which --removable does not create.
installEFIFallback: false
