#
# Enables systemd units on the installed system.
# Schema-valid keys only — the module reads cfg.get("units", []),
# and the schema (services-systemd.schema.yaml) uses additionalProperties:
# false with a top-level "units" key. The old "services:" key was
# silently ignored, so NO services got enabled at install time.
#
---
units:
  - name: NetworkManager
    mandatory: true
  - name: bluetooth
    mandatory: false
  - name: seatd
    mandatory: true
  - name: wireplumber
    mandatory: true
  - name: pipewire
    mandatory: true
  - name: pipewire-pulse
    mandatory: true
  - name: darkos-grub-repair
    mandatory: true
